[pytest]
# Where the tests live. Keeping them in one directory means `pytest` with no
# arguments is always the right command, and nobody has to remember a path.
testpaths = tests

# Only files/classes/functions matching these are collected. These are the
# defaults, written out so the convention is visible rather than folklore.
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -q            quiet: one character per test, not a line per test
# --strict-markers  a typo'd @pytest.mark.asyncio becomes an error, not a
#                   silently-ignored decorator that makes a test never run
# -ra           at the end, summarise everything that was not a plain pass
addopts = -q --strict-markers -ra

# pytest-asyncio: "strict" means an async test only runs if it is explicitly
# marked @pytest.mark.asyncio. The alternative ("auto") runs every async def it
# finds, which is convenient right up until it silently swallows one.
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

markers =
    slow: tests that are noticeably slower than the rest (deselect with -m "not slow")
