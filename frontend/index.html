<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dream Companies</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-gray-50 min-h-screen" x-data="dashboard()" x-init="init()">

  <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-semibold text-gray-900 tracking-tight">Dream Companies</h1>
        <p class="text-xs text-gray-400 mt-0.5">
          What moved this week at the 15 places worth working
        </p>
      </div>
      <div class="flex items-center gap-4">
        <a href="/api/digest/preview" target="_blank"
           class="text-sm text-gray-500 hover:text-gray-700">Digest preview</a>
        <a href="/settings.html" class="text-sm text-gray-500 hover:text-gray-700">Settings</a>
        <button @click="refreshAll()" :disabled="refreshing"
          class="inline-flex items-center gap-2 px-4 py-2 bg-gray-900 text-white text-sm font-medium rounded-lg hover:bg-gray-700 disabled:opacity-50">
          <svg :class="refreshing ? 'animate-spin' : ''" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span x-text="refreshing ? 'Refreshing…' : 'Refresh all'"></span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8">

    <div x-show="loading" x-cloak class="space-y-2">
      <template x-for="i in 8" :key="i">
        <div class="bg-white rounded-xl border border-gray-100 h-16 animate-pulse"></div>
      </template>
    </div>

    <div x-show="error && !loading" x-cloak class="bg-red-50 border border-red-200 rounded-xl p-6 text-center">
      <p class="text-red-700 text-sm font-medium" x-text="error"></p>
      <button @click="init()" class="mt-3 text-sm text-red-600 underline">Try again</button>
    </div>

    <div x-show="!loading && !error && companies.length === 0" x-cloak class="text-center py-20">
      <p class="text-gray-500 text-sm">No companies yet.</p>
      <a href="/settings.html" class="mt-3 inline-block text-sm text-blue-600 hover:underline">Add companies in settings</a>
    </div>

    <!-- Legend -->
    <div x-show="!loading && companies.length" x-cloak class="flex flex-wrap gap-3 mb-4 text-xs text-gray-500">
      <template x-for="f in flagOrder" :key="f">
        <span class="inline-flex items-center gap-1">
          <span x-text="flagIcons[f]"></span><span x-text="flagLabels[f]"></span>
        </span>
      </template>
      <span class="ml-auto" x-text="summary()"></span>
    </div>

    <div x-show="!loading && !error && companies.length > 0" x-cloak
         class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-gray-100">
            <th class="text-left text-xs font-medium text-gray-400 px-5 py-3">Company</th>
            <th class="text-left text-xs font-medium text-gray-400 px-3 py-3 w-40">Flags</th>
            <th class="text-left text-xs font-medium text-gray-400 px-3 py-3 min-w-[300px]">This week</th>
            <th class="text-right text-xs font-medium text-gray-400 px-3 py-3">Headcount</th>
            <th class="text-center text-xs font-medium text-gray-400 px-3 py-3">Early career</th>
            <th class="text-right text-xs font-medium text-gray-400 px-3 py-3">Last refresh</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="c in companies" :key="c.id">
            <tr class="border-b border-gray-50 hover:bg-gray-50 cursor-pointer align-top"
                @click="go(c.id)">
              <td class="px-5 py-4">
                <div class="font-medium text-gray-900" x-text="c.name"></div>
                <div class="text-xs text-gray-400" x-show="Object.keys(c.errors || {}).length"
                     x-text="Object.keys(c.errors).length + ' fetcher issue(s)'"></div>
              </td>

              <td class="px-3 py-4">
                <div class="flex flex-wrap gap-1">
                  <template x-for="f in c.active_flags" :key="f">
                    <span class="inline-block text-base leading-none" :title="flagLabels[f]"
                          x-text="flagIcons[f]"></span>
                  </template>
                  <span x-show="!c.active_flags.length" class="text-xs text-gray-300">quiet</span>
                </div>
              </td>

              <td class="px-3 py-4">
                <ul class="space-y-1">
                  <template x-for="(b, i) in (c.bullets || []).slice(0, 2)" :key="i">
                    <li class="text-gray-600 text-[13px] leading-snug" x-text="b"></li>
                  </template>
                </ul>
              </td>

              <td class="px-3 py-4 text-right whitespace-nowrap">
                <div class="text-gray-900" x-text="c.headcount_total"></div>
                <div class="text-xs" :class="trendClass(c)" x-text="trendText(c)"></div>
                <div class="text-xs text-gray-400" x-text="c.headcount_nyc + ' NYC'"></div>
              </td>

              <td class="px-3 py-4 text-center">
                <span x-show="c.early_career_count > 0"
                      class="inline-block px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 text-xs font-medium"
                      x-text="c.early_career_count"></span>
                <span x-show="!c.early_career_count" class="text-gray-300 text-xs">none</span>
              </td>

              <td class="px-3 py-4 text-right text-xs text-gray-400"
                  x-text="fmtDate(c.last_refresh)"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </main>

<script>
function dashboard() {
  return {
    companies: [], flagLabels: {}, flagIcons: {}, flagOrder: [],
    loading: true, error: '', refreshing: false,

    async init() {
      this.loading = true; this.error = '';
      try {
        const r = await fetch('/api/dashboard');
        if (!r.ok) throw new Error('Failed to load dashboard');
        const d = await r.json();
        this.companies = d.companies;
        this.flagLabels = d.flag_labels;
        this.flagIcons = d.flag_icons;
        this.flagOrder = d.flag_order;
      } catch (e) {
        this.error = e.message;
      } finally {
        this.loading = false;
      }
    },

    summary() {
      const active = this.companies.filter(c => c.flag_count > 0).length;
      return `${active} with activity, ${this.companies.length - active} quiet`;
    },

    trendText(c) {
      const t = c.trend && c.trend.total;
      if (!t || c.trend.first_snapshot) return 'baseline';
      if (t.delta === 0) return 'no change';
      return (t.delta > 0 ? '▲ +' : '▼ ') + t.delta;
    },

    trendClass(c) {
      const t = c.trend && c.trend.total;
      if (!t || c.trend.first_snapshot || t.delta === 0) return 'text-gray-400';
      return t.delta > 0 ? 'text-emerald-600' : 'text-rose-500';
    },

    fmtDate(iso) {
      if (!iso) return 'never';
      const d = new Date(iso + (iso.endsWith('Z') ? '' : 'Z'));
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    },

    go(id) { window.location.href = `/company.html?id=${id}`; },

    async refreshAll() {
      this.refreshing = true;
      try {
        await fetch('/api/refresh-all', { method: 'POST' });
        await this.init();
      } catch (e) {
        this.error = e.message;
      } finally {
        this.refreshing = false;
      }
    },
  };
}
</script>
</body>
</html>
